<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Projects — UniProjectHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">

  <!-- ══════════════════════════════════════════
       SIDEBAR
  ═══════════════════════════════════════════ -->
  <aside class="sidebar bg-white border-r border-slate-200 flex flex-col">
    <div class="p-5 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-green-400 to-teal-500 rounded-xl flex items-center justify-center text-white font-bold text-xs">UPH</div>
        <div>
          <div class="font-bold text-slate-900 text-sm">UniProjectHub</div>
          <div class="text-xs text-slate-400">BAIUST</div>
        </div>
      </div>
    </div>
    <div class="p-4 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div id="sidebar-avatar" class="w-9 h-9 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold text-sm">S</div>
        <div class="min-w-0 flex-1">
          <div id="sidebar-user-name" class="font-semibold text-slate-800 text-sm truncate">Loading…</div>
          <div id="sidebar-user-dept" class="text-xs text-slate-400 truncate">—</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-0.5">
      <a href="dashboard.html"       class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors">
        <span>🏠</span> Dashboard
      </a>
      <a href="browse-projects.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold bg-green-50 text-green-700">
        <span>🔍</span> Browse Projects
      </a>
      <a href="my-projects.html"     class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors">
        <span>📁</span> My Projects
      </a>
      <a href="profile.html"         class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors">
        <span>👤</span> Profile
      </a>
    </nav>
    <div class="p-3 border-t border-slate-100">
      <button id="logout-btn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-500 hover:bg-red-50 transition-colors">
        <span>🚪</span> Logout
      </button>
    </div>
  </aside>

  <!-- ══════════════════════════════════════════
       MAIN CONTENT
  ═══════════════════════════════════════════ -->
  <main class="main-content">

    <!-- Page Header -->
    <header class="bg-white border-b border-slate-200 px-8 py-5">
      <h1 class="text-xl font-bold text-slate-900">Browse Projects</h1>
      <p class="text-sm text-slate-500 mt-0.5">Explore the entire BAIUST project repository.</p>
    </header>

    <div class="p-8 flex gap-6">

      <!-- ── Left Filter Panel ──────────────────────────── -->
      <aside class="w-56 flex-shrink-0">
        <div class="bg-white border border-slate-200 rounded-xl p-5 sticky top-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold text-slate-800">Filters</h2>
            <button id="clear-filters" class="text-xs text-green-600 hover:underline">Clear all</button>
          </div>

          <!-- Search -->
          <div class="mb-4">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1.5">Search</label>
            <input id="search-input" type="text" placeholder="Project name or keyword…"
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-green-400">
          </div>

          <!-- Department -->
          <div class="mb-4">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1.5">Department</label>
            <select id="filter-dept"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
              <option value="">All Departments</option>
              <option value="CSE">CSE</option>
              <option value="EEE">EEE</option>
              <option value="ME">ME</option>
              <option value="CE">CE</option>
              <option value="MBA">MBA</option>
              <option value="BBA">BBA</option>
            </select>
          </div>

          <!-- Batch -->
          <div class="mb-4">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1.5">Batch</label>
            <select id="filter-batch"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
              <option value="">All Batches</option>
              <!-- Populated by browse.js -->
            </select>
          </div>

          <!-- Category -->
          <div class="mb-4">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1.5">Category</label>
            <select id="filter-category"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
              <option value="">All Categories</option>
              <!-- Populated by browse.js -->
            </select>
          </div>

          <!-- Tech Stack -->
          <div>
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1.5">Tech Stack</label>
            <select id="filter-tech"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
              <option value="">All Tech</option>
              <!-- Populated by browse.js -->
            </select>
          </div>

        </div>
      </aside>

      <!-- ── Right: Projects Grid ────────────────────────── -->
      <div class="flex-1 min-w-0">
        <!-- Result count -->
        <div class="flex items-center justify-between mb-4">
          <p id="result-count" class="text-sm text-slate-500 font-medium">Loading…</p>
        </div>

        <!-- Grid -->
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          <!-- Populated by browse.js -->
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="js/browse.js"></script>
</body>
</html>
