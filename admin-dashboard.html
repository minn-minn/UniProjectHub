<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — UniProjectHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50" data-page="admin-dashboard">

  <!-- ADMIN SIDEBAR -->
  <aside class="sidebar bg-white border-r border-slate-200 flex flex-col">
    <div class="p-5 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-violet-500 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold text-xs">ADM</div>
        <div>
          <div class="font-bold text-slate-900 text-sm">UniProjectHub</div>
          <div class="text-xs text-violet-500 font-medium">Admin Panel</div>
        </div>
      </div>
    </div>
    <div class="p-4 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-violet-500 flex items-center justify-center text-white font-semibold text-sm">A</div>
        <div class="min-w-0 flex-1">
          <div id="sidebar-user-name" class="font-semibold text-slate-800 text-sm truncate">Admin</div>
          <div id="sidebar-user-dept" class="text-xs text-violet-500 truncate font-medium">Administrator</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-0.5">
      <a href="admin-dashboard.html"    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold bg-violet-50 text-violet-700">
        <span>🏠</span> Dashboard
      </a>
      <a href="batch-management.html"   class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors">
        <span>📦</span> Batch Management
      </a>
      <a href="metadata-management.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors">
        <span>⚙️</span> Metadata
      </a>
      <a href="analytics.html"          class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors">
        <span>📊</span> Analytics
      </a>
    </nav>
    <div class="p-3 border-t border-slate-100">
      <button id="logout-btn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-500 hover:bg-red-50 transition-colors">
        <span>🚪</span> Logout
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <header class="bg-white border-b border-slate-200 px-8 py-5">
      <h1 class="text-xl font-bold text-slate-900">Admin Dashboard</h1>
      <p class="text-sm text-slate-500 mt-0.5">System overview and management.</p>
    </header>

    <div class="p-8">

      <!-- Stats Row -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white border border-slate-200 rounded-xl p-5">
          <div class="text-3xl mb-1">📁</div>
          <div id="stat-total-projects" class="text-2xl font-bold text-slate-900">—</div>
          <div class="text-sm text-slate-500">Total Projects</div>
        </div>
        <div class="bg-white border border-slate-200 rounded-xl p-5">
          <div class="text-3xl mb-1">🎓</div>
          <div id="stat-total-batches" class="text-2xl font-bold text-slate-900">—</div>
          <div class="text-sm text-slate-500">Batches</div>
        </div>
        <div class="bg-white border border-slate-200 rounded-xl p-5">
          <div class="text-3xl mb-1">🏷️</div>
          <div id="stat-total-cats" class="text-2xl font-bold text-slate-900">—</div>
          <div class="text-sm text-slate-500">Categories</div>
        </div>
        <div class="bg-white border border-slate-200 rounded-xl p-5">
          <div class="text-3xl mb-1">💻</div>
          <div id="stat-total-tech" class="text-2xl font-bold text-slate-900">—</div>
          <div class="text-sm text-slate-500">Tech Stacks</div>
        </div>
      </div>

      <!-- Recent Projects Table -->
      <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-semibold text-slate-800">Recent Projects</h2>
          <a href="browse-projects.html" class="text-sm text-green-600 hover:underline">View All</a>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="border-b border-slate-100 bg-slate-50">
                <th class="text-left py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wide">Project</th>
                <th class="text-left py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wide">Dept</th>
                <th class="text-left py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wide">Batch</th>
                <th class="text-left py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wide">Team</th>
                <th class="text-left py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wide">Created</th>
              </tr>
            </thead>
            <tbody id="recent-projects-tbody">
              <tr><td colspan="5" class="text-center py-8 text-slate-400 text-sm">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
