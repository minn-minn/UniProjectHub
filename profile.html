<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — UniProjectHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">

  <!-- SIDEBAR -->
  <aside class="sidebar bg-white border-r border-slate-200 flex flex-col">
    <div class="p-5 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-green-400 to-teal-500 rounded-xl flex items-center justify-center text-white font-bold text-xs">UPH</div>
        <div>
          <div class="font-bold text-slate-900 text-sm">UniProjectHub</div>
          <div class="text-xs text-slate-400">BAIUST</div>
        </div>
      </div>
    </div>
    <div class="p-4 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div id="sidebar-avatar" class="w-9 h-9 rounded-full bg-blue-500 flex items-center justify-center text-white font-semibold text-sm">S</div>
        <div class="min-w-0 flex-1">
          <div id="sidebar-user-name" class="font-semibold text-slate-800 text-sm truncate">Loading…</div>
          <div id="sidebar-user-dept" class="text-xs text-slate-400 truncate">—</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-0.5">
      <a href="dashboard.html"       class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors"><span>🏠</span> Dashboard</a>
      <a href="browse-projects.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors"><span>🔍</span> Browse Projects</a>
      <a href="my-projects.html"     class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors"><span>📁</span> My Projects</a>
      <a href="profile.html"         class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold bg-green-50 text-green-700"><span>👤</span> Profile</a>
    </nav>
    <div class="p-3 border-t border-slate-100">
      <button id="logout-btn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-500 hover:bg-red-50 transition-colors"><span>🚪</span> Logout</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- Page Header -->
    <header class="bg-white border-b border-slate-200 px-8 py-5">
      <h1 class="text-xl font-bold text-slate-900">My Profile</h1>
      <p class="text-sm text-slate-500 mt-0.5">Manage your account information.</p>
    </header>

    <div class="p-8">
      <div class="max-w-2xl">

        <!-- ── PROFILE VIEW ─────────────────────────────── -->
        <div id="profile-view">

          <!-- Avatar & Name Card -->
          <div class="bg-white border border-slate-200 rounded-2xl p-6 mb-5 flex items-center gap-5">
            <div id="profile-avatar" class="w-20 h-20 rounded-full bg-blue-500 flex items-center justify-center text-white text-3xl font-bold flex-shrink-0">S</div>
            <div>
              <h2 id="profile-name" class="text-xl font-bold text-slate-900">—</h2>
              <p id="profile-email" class="text-sm text-slate-500 mt-0.5">—</p>
              <div class="flex gap-2 mt-2">
                <span class="text-xs bg-green-50 text-green-700 border border-green-200 px-2 py-0.5 rounded-md font-medium" id="profile-dept">—</span>
                <span class="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-md font-medium" id="profile-batch">—</span>
              </div>
            </div>
          </div>

          <!-- Details Card -->
          <div class="bg-white border border-slate-200 rounded-2xl p-6 mb-5">
            <h3 class="font-semibold text-slate-700 text-sm mb-4">Account Details</h3>
            <div class="grid grid-cols-2 gap-5">
              <div>
                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide mb-1">University ID</p>
                <p id="profile-id" class="text-sm text-slate-700 font-semibold">—</p>
              </div>
              <div>
                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide mb-1">Lab Group</p>
                <p id="profile-group" class="text-sm text-slate-700 font-semibold">—</p>
              </div>
              <div>
                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide mb-1">Joined</p>
                <p id="profile-joined" class="text-sm text-slate-700 font-semibold">—</p>
              </div>
            </div>
          </div>

          <!-- Edit Button -->
          <button id="edit-btn"
                  class="bg-green-500 hover:bg-green-600 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition-colors">
            ✏️ Edit Profile
          </button>
        </div>

        <!-- ── EDIT FORM (hidden by default) ─────────────── -->
        <div id="profile-edit" class="hidden">
          <div class="bg-white border border-slate-200 rounded-2xl p-6">
            <h3 class="font-semibold text-slate-800 mb-5">Edit Profile</h3>

            <form id="edit-form" class="space-y-4">

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
                <input id="edit-name" type="text"
                       class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-400">
              </div>

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Department</label>
                <select id="edit-dept"
                        class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
                  <option value="">Select Department</option>
                  <option value="CSE">CSE</option>
                  <option value="EEE">EEE</option>
                  <option value="ME">ME</option>
                  <option value="CE">CE</option>
                  <option value="MBA">MBA</option>
                  <option value="BBA">BBA</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Batch</label>
                <select id="edit-batch"
                        class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
                  <option value="">Select Batch</option>
                  <!-- Populated by profile.js -->
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5">Lab Group</label>
                <select id="edit-group"
                        class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-400 bg-white">
                  <option value="">Select Group</option>
                  <!-- Populated by profile.js -->
                </select>
              </div>

              <div class="flex gap-3 pt-2">
                <button type="submit" id="save-profile-btn"
                        class="bg-green-500 hover:bg-green-600 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition-colors">
                  Save Changes
                </button>
                <button type="button" id="cancel-edit-btn"
                        class="border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-medium px-5 py-2.5 rounded-xl transition-colors">
                  Cancel
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
