<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — UniProjectHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50" data-page="analytics">

  <!-- ADMIN SIDEBAR -->
  <aside class="sidebar bg-white border-r border-slate-200 flex flex-col">
    <div class="p-5 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-gradient-to-br from-violet-500 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold text-xs">ADM</div>
        <div>
          <div class="font-bold text-slate-900 text-sm">UniProjectHub</div>
          <div class="text-xs text-violet-500 font-medium">Admin Panel</div>
        </div>
      </div>
    </div>
    <div class="p-4 border-b border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-violet-500 flex items-center justify-center text-white font-semibold text-sm">A</div>
        <div class="min-w-0 flex-1">
          <div id="sidebar-user-name" class="font-semibold text-slate-800 text-sm truncate">Admin</div>
          <div id="sidebar-user-dept" class="text-xs text-violet-500 font-medium">Administrator</div>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-0.5">
      <a href="admin-dashboard.html"    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors"><span>🏠</span> Dashboard</a>
      <a href="batch-management.html"   class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors"><span>📦</span> Batch Management</a>
      <a href="metadata-management.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors"><span>⚙️</span> Metadata</a>
      <a href="analytics.html"          class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold bg-violet-50 text-violet-700"><span>📊</span> Analytics</a>
    </nav>
    <div class="p-3 border-t border-slate-100">
      <button id="logout-btn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-red-500 hover:bg-red-50 transition-colors"><span>🚪</span> Logout</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <header class="bg-white border-b border-slate-200 px-8 py-5">
      <h1 class="text-xl font-bold text-slate-900">Analytics</h1>
      <p class="text-sm text-slate-500 mt-0.5">Insights from the UniProjectHub repository.</p>
    </header>

    <div class="p-8">
      <div id="analytics-content">
        <!-- Loaded by admin.js -->
        <div class="flex items-center justify-center py-16 text-slate-400">
          <div class="text-center">
            <div class="w-8 h-8 border-2 border-violet-400 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
            <p class="text-sm">Loading analytics…</p>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
