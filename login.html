<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — UniProjectHub</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="auth-page">

  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-60 h-12 bg-gradient-to-br from-green-400 to-teal-500 rounded-2xl flex items-center justify-center text-white font-bold text-lg mx-auto mb-4 shadow-md">
        UniProjectHub
      </div>
      <h1 class="text-2xl font-bold text-slate-900">UniProjectHub</h1>
      <p class="text-slate-500 text-sm mt-1">BAIUST · Project Knowledge Repository</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
      <h2 class="text-lg font-semibold text-slate-800 mb-6">Sign in to your account</h2>

      <!-- Error Message Box -->
      <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-5"></div>

      <!-- Login Form -->
      <div class="space-y-4">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">University Email</label>
          <input id="email" type="email" placeholder="sadia@mail.com"
                 class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition-shadow">
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="text-sm font-medium text-slate-700">Password</label>
            <a href="#" id="forgot-link" class="text-xs text-green-600 hover:underline">Forgot password?</a>
          </div>
          <input id="password" type="password" placeholder="Enter your password"
                 class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition-shadow">
        </div>

        <!-- Login Button -->
        <button id="login-btn"
                class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors mt-2">
          Sign In
        </button>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-5">
        <hr class="flex-1 border-slate-200">
        <span class="text-xs text-slate-400">OR</span>
        <hr class="flex-1 border-slate-200">
      </div>

      <!-- Register link -->
      <p class="text-center text-sm text-slate-600">
        Don't have an account?
        <a href="register.html" class="text-green-600 font-semibold hover:underline ml-1">Register here</a>
      </p>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-400 mt-6">
      Bangladesh Army International University of Science &amp; Technology
    </p>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6">
      <h3 class="font-semibold text-slate-800 mb-2">Reset Password</h3>
      <p class="text-sm text-slate-500 mb-4">Enter your email and we'll send a reset link.</p>
      <input id="reset-email" type="email" placeholder="Your email address"
             class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-green-400">
      <div class="flex gap-3">
        <button id="cancel-reset" class="flex-1 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Cancel</button>
        <button id="send-reset"   class="flex-1 py-2.5 bg-green-500 text-white rounded-lg text-sm font-semibold hover:bg-green-600">Send Link</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { loginStudent, redirectIfLoggedIn, friendlyAuthError, resetPassword } from './js/auth.js';
    import { showToast } from './js/utils.js';

    // If already logged in, skip to dashboard
    redirectIfLoggedIn();

    // ── Login ──────────────────────────────────────────────────
    document.getElementById('login-btn').addEventListener('click', async () => {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error-box');
      const btn      = document.getElementById('login-btn');

      errorBox.classList.add('hidden');

      if (!email || !password) {
        errorBox.textContent = 'Please enter your email and password.';
        errorBox.classList.remove('hidden');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Signing in…';

      try {
        await loginStudent(email, password);
        // Redirect is handled inside loginStudent via onAuthStateChanged in index
        window.location.href = 'index.html';
      } catch (err) {
        errorBox.textContent = friendlyAuthError(err);
        errorBox.classList.remove('hidden');
        btn.disabled    = false;
        btn.textContent = 'Sign In';
      }
    });

    // Allow pressing Enter to login
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    // ── Forgot Password ────────────────────────────────────────
    const modal = document.getElementById('forgot-modal');
    document.getElementById('forgot-link').addEventListener('click', (e) => {
      e.preventDefault();
      modal.classList.remove('hidden');
    });
    document.getElementById('cancel-reset').addEventListener('click', () => {
      modal.classList.add('hidden');
    });
    document.getElementById('send-reset').addEventListener('click', async () => {
      const email = document.getElementById('reset-email').value.trim();
      if (!email) { showToast('Enter your email first.', 'error'); return; }
      try {
        await resetPassword(email);
        modal.classList.add('hidden');
        showToast('Reset link sent! Check your inbox.');
      } catch (err) {
        showToast('Could not send reset email.', 'error');
      }
    });
  </script>
</body>
</html>
